
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CGA ABISHEK | Tic Tac Toe</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #080d18;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.game {
    width: 100%;
    max-width: 420px;
    text-align: center;
    background: #111b2b;
    border: 1px solid #00ffae;
    border-radius: 20px;
    padding: 25px 18px;
    box-shadow: 0 0 25px #00ffae33;
}

h1 {
    color: #00ffae;
    font-size: 29px;
    margin-bottom: 8px;
}

.subtitle {
    color: #9baec5;
    margin-bottom: 25px;
}

.scoreboard {
    display: flex;
    justify-content: space-around;
    margin-bottom: 20px;
    gap: 10px;
}

.score {
    background: #1b2a40;
    padding: 12px;
    border-radius: 12px;
    flex: 1;
    border: 1px solid #34465e;
}

.score h3 {
    font-size: 15px;
    color: #a9bad0;
}

.score p {
    font-size: 25px;
    color: #00ffae;
    margin-top: 5px;
}

.status {
    color: #00ffae;
    font-size: 19px;
    font-weight: bold;
    margin: 20px 0;
    min-height: 24px;
}

.board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    width: 100%;
    max-width: 330px;
    margin: auto;
}

.cell {
    aspect-ratio: 1;
    background: #1b2a40;
    border: 2px solid #34465e;
    border-radius: 12px;
    color: white;
    font-size: 55px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.cell:active {
    transform: scale(0.94);
}

.cell.x {
    color: #00ffae;
    text-shadow: 0 0 15px #00ffae;
}

.cell.o {
    color: #ff4f85;
    text-shadow: 0 0 15px #ff4f85;
}

.cell.winner {
    background: #164c3a;
    border-color: #00ffae;
}

.controls {
    display: flex;
    gap: 10px;
    margin-top: 25px;
}

.controls button {
    flex: 1;
    padding: 14px 8px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.restart {
    background: #00ffae;
    color: #07130f;
}

.reset {
    background: #ff4f85;
    color: white;
}

.controls button:active {
    transform: scale(0.96);
}

.footer {
    margin-top: 25px;
    color: #70849e;
    font-size: 12px;
}

</style>
</head>

<body>

<div class="game">

    <h1>⚡ CGA ABISHEK</h1>
    <p class="subtitle">TIC TAC TOE GAME</p>

    <div class="scoreboard">
        <div class="score">
            <h3>PLAYER X</h3>
            <p id="scoreX">0</p>
        </div>

        <div class="score">
            <h3>DRAWS</h3>
            <p id="draws">0</p>
        </div>

        <div class="score">
            <h3>PLAYER O</h3>
            <p id="scoreO">0</p>
        </div>
    </div>

    <div class="status" id="status">
        Player X's Turn
    </div>

    <div class="board" id="board">
        <button class="cell" data-index="0"></button>
        <button class="cell" data-index="1"></button>
        <button class="cell" data-index="2"></button>
        <button class="cell" data-index="3"></button>
        <button class="cell" data-index="4"></button>
        <button class="cell" data-index="5"></button>
        <button class="cell" data-index="6"></button>
        <button class="cell" data-index="7"></button>
        <button class="cell" data-index="8"></button>
    </div>

    <div class="controls">
        <button class="restart" onclick="restartGame()">
            ↻ RESTART
        </button>

        <button class="reset" onclick="resetGame()">
            RESET SCORE
        </button>
    </div>

    <p class="footer">
        CREATED BY CGA ABISHEK | © 2026
    </p>

</div>

<script>

const cells = document.querySelectorAll(".cell");
const statusText = document.getElementById("status");

let board = ["", "", "", "", "", "", "", "", ""];
let currentPlayer = "X";
let gameActive = true;

let scoreX = 0;
let scoreO = 0;
let draws = 0;

const winningPatterns = [
    [0, 1, 2],
    [3, 4, 5],
    [6, 7, 8],
    [0, 3, 6],
    [1, 4, 7],
    [2, 5, 8],
    [0, 4, 8],
    [2, 4, 6]
];

cells.forEach(cell => {
    cell.addEventListener("click", () => {
        const index = Number(cell.dataset.index);

        if (board[index] !== "" || !gameActive) {
            return;
        }

        board[index] = currentPlayer;
        cell.textContent = currentPlayer;
        cell.classList.add(currentPlayer.toLowerCase());

        checkWinner();
    });
});

function checkWinner() {

    let winningPattern = null;

    for (let pattern of winningPatterns) {
        const [a, b, c] = pattern;

        if (
            board[a] !== "" &&
            board[a] === board[b] &&
            board[b] === board[c]
        ) {
            winningPattern = pattern;
            break;
        }
    }

    if (winningPattern) {
        gameActive = false;

        winningPattern.forEach(index => {
            cells[index].classList.add("winner");
        });

        if (currentPlayer === "X") {
            scoreX++;
            document.getElementById("scoreX").textContent = scoreX;
        } else {
            scoreO++;
            document.getElementById("scoreO").textContent = scoreO;
        }

        statusText.textContent = "🏆 Player " + currentPlayer + " Wins!";
        return;
    }

    if (!board.includes("")) {
        gameActive = false;
        draws++;

        document.getElementById("draws").textContent = draws;
        statusText.textContent = "🤝 It's a Draw!";
        return;
    }

    currentPlayer = currentPlayer === "X" ? "O" : "X";

    statusText.textContent =
        "Player " + currentPlayer + "'s Turn";
}

function restartGame() {
    board = ["", "", "", "", "", "", "", "", ""];
    currentPlayer = "X";
    gameActive = true;

    cells.forEach(cell => {
        cell.textContent = "";
        cell.classList.remove("x", "o", "winner");
    });

    statusText.textContent = "Player X's Turn";
}

function resetGame() {
    scoreX = 0;
    scoreO = 0;
    draws = 0;

    document.getElementById("scoreX").textContent = 0;
    document.getElementById("scoreO").textContent = 0;
    document.getElementById("draws").textContent = 0;

    restartGame();
}

</script>

</body>
</html>
